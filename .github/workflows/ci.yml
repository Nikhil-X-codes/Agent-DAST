name: AgentShield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run offline unit tests (no external LLM calls)
        run: pytest -m unit -v

  security-gate:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run policy fixture gate (deliberately failing fixture must fail CI)
        # Runs the deterministic policy unit tests including the confirmed-finding fixture.
        # Gate fails if any confirmed critical/high fixture does not raise.
        run: pytest tests/unit/test_guard.py tests/unit/test_evaluation.py tests/unit/test_ci_gate.py -v
      - name: Upload SARIF artifacts (if any exist)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarif-reports
          path: "reports/*.sarif"
          if-no-files-found: ignore

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build React dashboard
        working-directory: frontend
        run: npm install && npm run build

